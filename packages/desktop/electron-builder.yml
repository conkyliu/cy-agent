# electron-builder 打包配置：macOS / Windows / Linux 产物。
appId: com.cyagent.desktop
productName: cy-agent
publish:
  provider: github
  owner: conkyliu
  repo: cy-agent
directories:
  output: release
files:
  - dist/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # 未配置签名证书时跳过自动签名。
  identity: null
dmg:
  title: cy-agent
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Development
deb:
  # 显式命名，避免使用 scoped 包名（含 "/"）导致 fpm 写入不存在的子目录。
  artifactName: ${productName}_${version}_${arch}.${ext}
